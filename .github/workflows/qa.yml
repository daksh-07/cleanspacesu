name: Clean Space QA

on:
  push:
    branches:
      - main
      - feat/clean-space-premium-site
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build and QA
        run: npm run qa
      - name: Verify static routes
        run: |
          test -f public/index.html
          test -f public/services/index.html
          test -f public/work/index.html
          test -f public/about/index.html
          test -f public/contact/index.html
          find public/images -type f -name '*.webp' | wc -l
