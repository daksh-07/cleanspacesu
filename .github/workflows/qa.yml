name: Clean Space QA

on:
  push:
    branches:
      - main
      - fix/clean-space-final-visual-pass
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and QA
        run: npm run qa

      - name: Verify static routes
        run: |
          test -f public/index.html
          test -f public/services/index.html
          test -f public/work/index.html
          test -f public/about/index.html
          test -f public/contact/index.html
          test "$(find public/images -type f -name '*.webp' | wc -l)" -ge 12

      - name: Install responsive browser engines
        run: npx -y playwright@1.56.1 install --with-deps chromium webkit

      - name: Responsive browser capture
        run: |
          mkdir -p qa-artifacts
          python3 -m http.server 4173 --directory public > /tmp/clean-space-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2

          for route in "" services work about contact; do
            name="${route:-home}"
            curl -fsS "http://127.0.0.1:4173/${route}" > /dev/null
            npx -y playwright@1.56.1 screenshot -b webkit --viewport-size="390,844" --full-page "http://127.0.0.1:4173/${route}" "qa-artifacts/${name}-390-webkit.png"
            npx -y playwright@1.56.1 screenshot -b chromium --viewport-size="1440,1000" --full-page "http://127.0.0.1:4173/${route}" "qa-artifacts/${name}-1440-chromium.png"
          done

          for width in 320 375 393 402 430; do
            npx -y playwright@1.56.1 screenshot -b webkit --viewport-size="${width},844" --full-page "http://127.0.0.1:4173/" "qa-artifacts/home-${width}-webkit.png"
          done

          for width in 1280 1366 1728 1920; do
            npx -y playwright@1.56.1 screenshot -b chromium --viewport-size="${width},1000" --full-page "http://127.0.0.1:4173/" "qa-artifacts/home-${width}-chromium.png"
          done

      - name: Upload responsive QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-space-responsive-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
